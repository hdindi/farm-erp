# Nginx configuration for Farm ERP UAT Environment
# File: /etc/nginx/sites-available/uat-kinjabi-farm

server {
    listen 80;
    server_name uat.kinjabi.farm;
    root /var/www/farm-erp-uat/public;
    
    index index.php index.html index.htm;
    
    # UAT environment headers
    add_header X-Environment "UAT" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP handling
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # FastCGI timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }
    
    # Static file handling
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|tar|woff|svg|ttf|eot|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\.ht {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to version control
    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to composer files
    location ~ /(composer\.(json|lock)|package\.json|yarn\.lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to storage and cache directories (except public)
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Allow storage/app/public (symlinked as public/storage)
    location ^~ /storage/ {
        alias /var/www/farm-erp-uat/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # Error and access logs
    access_log /var/log/nginx/uat.kinjabi.farm_access.log;
    error_log /var/log/nginx/uat.kinjabi.farm_error.log warn;
    
    # Limit request size
    client_max_body_size 64M;
    
    # Timeout settings
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;
}

# SSL configuration will be automatically added by certbot
# The above server block will be modified to redirect to HTTPS
# and a new server block for port 443 will be created