name: UAT Deployment

on:
  push:
    branches: [ uat ]
  pull_request:
    branches: [ uat ]

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, iconv, json, mbstring, pdo
        
    - name: Copy .env.uat to .env
      run: cp .env.uat .env
      
    - name: Install Composer dependencies
      run: composer install --optimize-autoloader --no-dev
      
    - name: Generate application key
      run: php artisan key:generate
      
    - name: Run tests
      run: php artisan test
      
    - name: Deploy to UAT server
      if: github.ref == 'refs/heads/uat'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.UAT_HOST }}
        username: ${{ secrets.UAT_USERNAME }}
        key: ${{ secrets.UAT_SSH_KEY }}
        script: |
          cd /var/www/farm-erp-uat
          
          # Backup current deployment
          sudo cp -r /var/www/farm-erp-uat /var/www/farm-erp-uat-backup-$(date +%Y%m%d_%H%M%S) || true
          
          # Pull latest code
          sudo git fetch origin
          sudo git checkout uat
          sudo git pull origin uat
          
          # Install/update dependencies
          sudo -u www-data composer install --optimize-autoloader --no-dev
          
          # Run Laravel commands
          sudo -u www-data php artisan migrate --force
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache
          
          # Set proper permissions
          sudo chown -R www-data:www-data /var/www/farm-erp-uat
          sudo chmod -R 755 /var/www/farm-erp-uat
          sudo chmod -R 775 /var/www/farm-erp-uat/storage
          sudo chmod -R 775 /var/www/farm-erp-uat/bootstrap/cache
          
          # Restart services
          sudo systemctl reload php8.2-fpm
          sudo systemctl reload nginx
          
          echo "UAT deployment completed successfully!"